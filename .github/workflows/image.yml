# Builds ghcr.io/de0ch/hk-news-stream on every push to main. The Jarvis 2 box runs it pinned by digest
# (DE0CH/jarvis2 k8s/apps/news.yaml): a new image goes live only when that pin is changed there.
name: image
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/amd64
          tags: ghcr.io/de0ch/hk-news-stream:sha-${{ github.sha }},ghcr.io/de0ch/hk-news-stream:latest
